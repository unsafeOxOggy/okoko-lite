; okoko-lite - polybar "islands" (style of waybar-themes V2.2 by HANCORE-linux)
; Each island is its own small bar, floating over the desktop (override-redirect).
; i3 keeps room for them with "gaps top 36". launch.sh starts the four of them.
;
;  [ icons ][ workspaces ]          [ window title ]          [ vpn  cpu  mem  date ]

[colors]
background = #E6091413
border = #CCB0E4CC
foreground = #B0E4CC
surface = #285A48
muted = #6E9A8A
alert = #E0607E
bg = #091413

[settings]
; off: an in-place reload leaves the islands blank after a resize, launch.sh relaunches them
screenchange-reload = false

[island]
monitor = ${env:MONITOR:}
height = 24
offset-y = 5
radius = 4
border-size = 2
border-color = ${colors.border}
background = ${colors.background}
foreground = ${colors.foreground}
padding = 1
module-margin = 1
fixed-center = true
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=9;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=11;3"
override-redirect = true
wm-restack = i3
cursor-click = pointer

[bar/icons]
inherit = island
width = 84
offset-x = 6
modules-center = logo apps power

[bar/workspaces]
inherit = island
width = 172
offset-x = 94
modules-center = i3

[bar/title]
inherit = island
width = 22%
offset-x = 39%
modules-center = xwindow

[bar/status]
inherit = island
width = 380
offset-x = 100%:-386
module-margin = 2
modules-center = vpn cpu memory date

[module/logo]
type = custom/text
format = ""
format-font = 2
click-left = kitty -1 --instance-group okoko --class okoko-float

[module/apps]
type = custom/text
format = "󰍉"
format-font = 2
click-left = rofi -show drun

[module/power]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.alert}
click-left = ~/.config/rofi/powermenu.sh

; boxes: active = light, occupied = muted, urgent = red
[module/i3]
type = internal/i3
pin-workspaces = true
enable-scroll = false
label-focused = %index%
label-focused-background = ${colors.foreground}
label-focused-foreground = ${colors.bg}
label-focused-padding = 1
label-focused-margin = 2px
label-unfocused = %index%
label-unfocused-background = ${colors.muted}
label-unfocused-foreground = ${colors.bg}
label-unfocused-padding = 1
label-unfocused-margin = 2px
label-visible = %index%
label-visible-background = ${colors.surface}
label-visible-padding = 1
label-visible-margin = 2px
label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 1
label-urgent-margin = 2px

[module/xwindow]
type = internal/xwindow
label = %title:0:55:...%
label-empty = okoko
label-empty-foreground = ${colors.muted}

; VPN (tun0) address, "down" without VPN
[module/vpn]
type = custom/script
exec = ip -4 -o addr show tun0 2>/dev/null | awk '{sub("/.*", "", $4); print $4; f = 1} END {if (!f) print "down"}'
interval = 3
format-suffix = " 󰖂"
format-suffix-font = 2

[module/cpu]
type = internal/cpu
interval = 2
label = %percentage%%
format-suffix = " 󰍛"
format-suffix-font = 2

[module/memory]
type = internal/memory
interval = 3
label = %percentage_used%%
format-suffix = " "
format-suffix-font = 2

[module/date]
type = internal/date
interval = 1
date = %H:%M %a
date-alt = %d/%m/%Y  %H:%M:%S
format-prefix = "󰃭 "
format-prefix-font = 2
label = %date%
